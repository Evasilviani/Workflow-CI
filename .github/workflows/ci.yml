name: CI - Heart Disease MLflow Training

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Setup Python
      # -------------------------------------------------------
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------------
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install \
            mlflow==2.13.0 \
            scikit-learn==1.4.2 \
            pandas==2.2.2 \
            matplotlib==3.8.4 \
            dagshub==0.3.36 \
            cloudpickle

      # -------------------------------------------------------
      # 4. Run Modelling.py langsung
      # -------------------------------------------------------
      - name: Run Training
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/evanursilviani2/Modelling_SML_EvaNurSilviani.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLProject
          python Modelling.py \
            --n_estimators 100 \
            --max_depth 5 \
            --min_samples_split 2

      # -------------------------------------------------------
      # 5. Simpan artefak ke GitHub (upload)
      # -------------------------------------------------------
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/artifacts/
          retention-days: 30

      # -------------------------------------------------------
      # 6. Commit artefak kembali ke repo
      # -------------------------------------------------------
      - name: Commit Artifacts to Repository
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ || true
          git diff --staged --quiet || git commit -m "ci: update artifacts from training run [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 7. Login ke Docker Hub
      # -------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------------------------------
      # 8. Build & Push Docker Image via mlflow build-docker
      # -------------------------------------------------------
      - name: Build Docker Image with MLflow
        run: |
          mlflow models build-docker \
            --name ${{ secrets.DOCKER_USERNAME }}/heart-disease-model \
            --env-manager=local

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest